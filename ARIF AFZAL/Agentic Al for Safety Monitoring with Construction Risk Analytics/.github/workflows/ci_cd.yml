name: CI/CD Pipeline - Construction Intelligence Hub

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test_and_build:
    name: Run Unit Tests & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize Database & Run Migrations Check
        env:
          APP_ENV: testing
          DATABASE_URL: sqlite:///./cih_test.db
        run: |
          python backend/init_db.py

      - name: Run Master Prompt 1 Unit Tests
        env:
          APP_ENV: testing
          DATABASE_URL: sqlite:///./cih_test.db
        run: |
          python tests/run_tests.py

      - name: Run Master Prompt 2 End-to-End Workflow Tests
        env:
          APP_ENV: testing
          DATABASE_URL: sqlite:///./cih_test.db
        run: |
          python tests/run_workflow_tests.py

      - name: Verify App Syntax & Import Validity
        run: |
          python -c "import ast; ast.parse(open('app.py', encoding='utf-8').read()); print('Syntax Valid!')"
